<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Syapa meeting recorder extension for capturing tab and microphone audio with automated transcription." />
    <title>Syapa: Meeting recorder</title>
    <style>
      /* Hallmark design system */
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --card: #ffffff;
        --text: #202124;
        --muted: #73757b;
        --line: #e5e5e7;
        --accent: #315efb;
        --accent-subtle: rgba(49, 94, 251, 0.08);
        --danger: #b91c1c;
        --danger-text: #fef2f2;
        --danger-subtle: rgba(220, 38, 38, 0.1);
        --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181b;
          --card: #222327;
          --text: #f4f4f5;
          --muted: #a5a6ad;
          --line: #36373d;
          --accent: #4a75ff;
          --accent-subtle: rgba(74, 117, 255, 0.12);
          --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
      }
      * { box-sizing: border-box; }
      html, body {
        overflow-x: clip;
      }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 16px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .mark {
        width: 24px;
        height: 24px;
        display: block;
        border-radius: 6px;
        object-fit: cover;
      }
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 8px;
        color: var(--muted);
        font-size: 10px;
      }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }
      .card {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        box-shadow: var(--card-shadow);
      }
      .eyebrow {
        color: var(--muted);
        font-size: 11px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 22px;
        line-height: 1.15;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }
      p { margin: 0; color: var(--muted); }
      .note { margin-top: 8px; font-size: 12px; line-height: 1.5; }
      button, a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      button:focus-visible, a.button:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button:active, a.button:active {
        transform: translateY(1px);
        opacity: 0.9;
      }
      button:disabled, input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .primary {
        width: 100%;
        margin-top: 16px;
        background: var(--text);
        color: var(--bg);
      }
      .secondary {
        width: 100%;
        margin-top: 8px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .danger {
        width: 100%;
        margin-top: 16px;
        background: var(--danger);
        color: var(--danger-text);
      }
      .nowrap {
        white-space: nowrap;
      }
      .consent {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        background: var(--accent-subtle);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }
      .error {
        margin-bottom: 12px;
        padding: 12px;
        border-radius: 8px;
        background: var(--danger-subtle);
        color: var(--danger);
        font-size: 11px;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--danger);
        font-weight: 600;
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
      }
      @media (prefers-reduced-motion: no-preference) {
        .dot {
          animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(1.2); }
        }
      }
      .timer {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .bars {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        margin: 16px 0;
      }
      .bar {
        width: 4px;
        border-radius: 4px;
        background: var(--accent);
        opacity: 0.8;
      }
      .transcript-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 180px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        margin: 12px 0;
        background: var(--bg);
      }
      .speaker {
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .line {
        color: var(--text);
        font-size: 12px;
        line-height: 1.4;
      }
      .suggestions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0;
      }
      .suggestion-card {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        font-size: 11px;
      }
      .suggestion-cat {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .suggestion-title {
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
      }
      .suggestion-action {
        color: var(--accent);
        font-size: 11px;
      }
      .footer {
        display: flex;
        justify-content: center;
        color: var(--muted);
        font-size: 11px;
      }
      .token-field {
        margin: 12px 0;
      }
      .token-input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-size: 11px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img class="mark" src="icons/syapa-32.png" alt="Syapa logo" />
          <span>Syapa</span>
        </div>
        <span class="badge">Tab and mic</span>
      </header>
      <section id="app" class="content"></section>
      <footer class="footer">Meeting recorder</footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
